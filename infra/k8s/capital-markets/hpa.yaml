apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capital-markets-api-hpa
  namespace: ants-capital-markets
  labels:
    app: ants
    component: capital-markets-api
    flavor: capital-markets
    project: ants-capital-markets
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capital-markets-api

  # Lab environment sizing - conservative
  minReplicas: 1
  maxReplicas: 3

  # Target metrics
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory-based scaling (optional)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # Scaling behavior (optional - controls rate of scaling)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
