apiVersion: v1
kind: Secret
metadata:
  name: ants-cm-secrets
  namespace: ants-capital-markets
  labels:
    app: ants
    flavor: capital-markets
    project: ants-capital-markets
type: Opaque
stringData:
  # Database connection - PLACEHOLDER
  DATABASE_URL: "postgresql://user:PASSWORD_PLACEHOLDER@db-host:5432/ants_cm?sslmode=require"

  # API Keys - PLACEHOLDER
  OPENAI_API_KEY: "sk-PLACEHOLDER_OPENAI_API_KEY"
  AZURE_OPENAI_KEY: "PLACEHOLDER_AZURE_OPENAI_KEY"

  # Azure configuration - PLACEHOLDER
  AZURE_KEY_VAULT_URI: "https://PLACEHOLDER-kv.vault.azure.net/"
  AZURE_MANAGED_IDENTITY_CLIENT_ID: "PLACEHOLDER_CLIENT_ID"

  # Service-to-service authentication - PLACEHOLDER
  JWT_SECRET: "PLACEHOLDER_JWT_SECRET_MIN_32_CHARS_LONG"

  # Message queue credentials - PLACEHOLDER
  RABBITMQ_URL: "amqp://user:PASSWORD_PLACEHOLDER@rabbitmq-host:5672/ants_cm"

