apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ants-cm-ingress
  namespace: ants-capital-markets
  labels:
    app: ants
    flavor: capital-markets
    project: ants-capital-markets
  annotations:
    # NGINX ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";

spec:
  ingressClassName: nginx

  # TLS configuration (placeholder)
  tls:
  - hosts:
    - api.ants-lab.example.com
    secretName: ants-cm-tls-cert

  rules:
  - host: api.ants-lab.example.com
    http:
      paths:
      - path: /api/v1/
        pathType: Prefix
        backend:
          service:
            name: capital-markets-api
            port:
              name: http

      # Health check endpoints (no auth)
      - path: /health
        pathType: Exact
        backend:
          service:
            name: capital-markets-api
            port:
              name: http

      - path: /ready
        pathType: Exact
        backend:
          service:
            name: capital-markets-api
            port:
              name: http

---
