{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capital-markets.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capital-markets.labels" . | nindent 4 }}
  annotations:
    description: "Service Account for Capital Markets ANTS agents"
    managed-by: "Helm"

---
# ClusterRole for agents
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capital-markets.fullname" . }}-agents
  labels:
    {{- include "capital-markets.labels" . | nindent 4 }}
  annotations:
    description: "ClusterRole for Capital Markets agents"

rules:
  # ConfigMap read access
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Secret read access (for Key Vault integration)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # Pod communication
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]

  # Logs access
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Events (for observability)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
# ClusterRoleBinding for agents
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "capital-markets.fullname" . }}-agents
  labels:
    {{- include "capital-markets.labels" . | nindent 4 }}
  annotations:
    description: "ClusterRoleBinding for Capital Markets agents"

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "capital-markets.fullname" . }}-agents

subjects:
  - kind: ServiceAccount
    name: {{ include "capital-markets.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
# Role for namespace-specific access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "capital-markets.fullname" . }}-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capital-markets.labels" . | nindent 4 }}
  annotations:
    description: "Role for Capital Markets agents in {{ .Release.Namespace }} namespace"

rules:
  # Full access to ConfigMaps in this namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Full access to Secrets in this namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Pod exec for debugging
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]

  # Port forwarding
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

---
# RoleBinding for namespace-specific access
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capital-markets.fullname" . }}-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capital-markets.labels" . | nindent 4 }}
  annotations:
    description: "RoleBinding for Capital Markets agents in {{ .Release.Namespace }} namespace"

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capital-markets.fullname" . }}-namespace

subjects:
  - kind: ServiceAccount
    name: {{ include "capital-markets.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- end }}
