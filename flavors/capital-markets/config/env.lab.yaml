# ==============================================================================
# ANTS Capital Markets — Lab Environment Configuration
#
# Created: 2026-03-04
# Purpose: Environment-specific settings for ants-cm-lab-aks deployment
#          in DNvidiaBTANF resource group (East US 2)
#
# Usage:
#   These values map to environment variables set in the K8s deployment.
#   The api_gateway.py reads them via os.environ at startup.
#
# Security Note:
#   API keys and passwords should be stored in Azure Key Vault in production.
#   For lab, they are set as K8s secrets or env vars.
# ==============================================================================

# --- Azure AI Foundry (LLM + Embeddings) ---
# All models deployed as PayGo Serverless in finance-rag-project (East US 2)
# Authentication: Key-based via OpenAI SDK
ai_foundry:
  # Base endpoint (shared by all model deployments in this resource)
  endpoint: "https://finance-rag-project-resource.services.ai.azure.com"
  api_version: "2024-05-01-preview"

  # Primary LLM — Llama-4-Maverick (agent reasoning)
  llm:
    deployment_name: "Llama-4-Maverick-17B-128E-Instruct-FP8"
    model_name: "Llama-4-Maverick-17B-128E-Instruct-FP8"
    max_tokens: 4096
    rate_limit_tpm: 250000   # 250K tokens/min
    rate_limit_rpm: 250      # 250 requests/min

  # Embeddings — text-embedding-3-small (RAG/vector search)
  embeddings:
    deployment_name: "text-embedding-3-small"
    model_name: "text-embedding-3-small"
    dimensions: 1536         # text-embedding-3-small output dims
    # Note: Our pgvector schema uses vector(1024) for NV-EmbedQA.
    # When using text-embedding-3-small, we can request 1024 dims
    # via the 'dimensions' parameter in the API call, or update the
    # schema to 1536. For lab, we'll use dimensions=1024 in API calls.

  # Fallback LLM — gpt-4o (if Llama-4 has issues)
  fallback_llm:
    deployment_name: "gpt-4o"
    model_name: "gpt-4o"
    api_version: "2024-11-20"

# --- PostgreSQL (pgvector) ---
postgres:
  host: "pg-ants-lab-cm.postgres.database.azure.com"
  port: 5432
  database: "capital_markets"
  user: "ants_admin"
  ssl_mode: "require"
  # password: stored in K8s secret 'pg-ants-secret'
  pool_min_size: 5
  pool_max_size: 20
  command_timeout: 60

# --- Redis (agent state caching) ---
redis:
  host: "redis-master.ants-capital-markets.svc.cluster.local"
  port: 6379
  db: 0
  # password: stored in K8s secret 'redis-secret'

# --- Azure NetApp Files (ANF) mount paths ---
anf:
  models: "/mnt/anf/models"
  episodic: "/mnt/anf/memory/episodic"
  semantic: "/mnt/anf/memory/semantic"
  procedural: "/mnt/anf/memory/procedural"
  learning: "/mnt/anf/learning"
  lakehouse: "/mnt/anf/lakehouse"
  receipts: "/mnt/anf/audit/receipts"

# --- AKS Cluster ---
aks:
  cluster: "ants-cm-lab-aks"
  namespace: "ants-capital-markets"
  resource_group: "DNvidiaBTANF"
  region: "eastus2"

# --- Observability ---
observability:
  otlp_endpoint: "http://otel-collector.ants-capital-markets.svc.cluster.local:4317"
  tracing_enabled: true
  metrics_enabled: true
  log_level: "INFO"

# --- OPA Policy Engine ---
opa:
  endpoint: "http://opa.ants-capital-markets.svc.cluster.local:8181"
  policy_path: "/v1/data/capital_markets"

# --- NeMo Guardrails ---
guardrails:
  endpoint: "http://guardrails.ants-capital-markets.svc.cluster.local:8090"
  config_path: "/app/ai/nemo/config/guardrails.yaml"

# --- Tenant Configuration ---
tenants:
  default_tenant: "ants-lab-demo"
  supported_tenants:
    - "ants-lab-demo"
    - "institutional-client-1"
    - "hedge-fund-alpha"
